<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forked Flavours: Recipe</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/recipe.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
</head>
<body>
    <script src="/js/pullhtml.js"></script> <!-- Contains pullHTML function to load html components -->
    <script src="/js/api.js"></script> <!-- Contains all functions to call the API -->

    <div id="insertHtmlNavbar"></div>
    <script>
        pullHTML('navbar', 'insertHtmlNavbar', () => {
            window.initNavbar();
            window.initLogin();
        });
    </script>
    <script defer src="/js/navbar.js"></script> <!-- Navbar related js -->
    <script defer src="/js/login.js"></script> <!-- js for login/logout button -->

    <main class="pb-5">
        <div class="recipe-header">
            <div class="recipe-header-overlay"></div>
            <div class="container h-100 text-white recipe-header-content">
                <div class="d-flex justify-content-between align-items-start">
                    <h1 class="recipe-header-title editable" contenteditable="false" id="EditableRecipeTitle">Recipe Title</h1>
                    <p class="fs-5" id="forkLabel">Posted by: <strong>Account name</strong></p>
                </div>
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-primary" id="editButton">Edit</button>
                    <button type="button" class="d-none editing btn btn-secondary" id="cancelButton2">Cancel</button>
                    <button class="btn btn-success" id="forkRecipeBtn">Fork</button>
                </div>
            </div>
        </div>

        <p class="editing d-none">
            <span>Photo url: </span>
            <a class="editable" contenteditable="false" id="EditablePhotoUrl">Recipe Title</a>
        </p>
        <div class="container my-5">
            <div class="justify-content-center">
                9<p class="editable" contenteditable="false" id="EditableDescription"></p>
            </div>
        </div>

        <div class="container my-5">
            <div class="row">
                <!-- Ingredients column -->
                <div class="col-lg-6">
                    <h2>Ingredients</h2>
                    <ul class="list-group ingredients" id="ingredients-list">
                    </ul>
                    <a href="#" class="editing d-none btn btn-primary" id="add-ingredient-btn">Add ingredient</a>
                </div>

                <!-- Method column -->
                <div class="col-lg-6">
                    <h2>Method</h2>
                    <ol class="list-group method" id="method-list">
                    </ol>
                    <a href="#" class="editing d-none btn btn-primary" id="add-step-btn">Add step</a>
                </div>
            </div>

            <div class="text-center mt-4 d-none" id="contentEditButtons">
                <button type="button" class="btn btn-secondary" id="cancelButton">Cancel</button>
                <button type="button" class="btn btn-success" id="saveButton">Save</button>
            </div>
        </div>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <a href="/user/_" id="account-link" class="text-decoration-none text-reset">
                            <div class="card-body text-center">
                                <img id="account-pfp" src="/img/placeholder-pfp.png" alt="User Profile Picture" class="rounded-circle mb-3" width="150" height="150">
                                <h2 class="card-title" id="account-display-name"></h2>
                                <p class="card-text text-muted" id="account-bio"></p>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dont show, possible future addition -->
        <div class="container my-5 recipe-bakes d-none">
            <h2>Bake Results</h2>
            <div class="row image-cards">
                <div class="col-md-4">
                    <div class="card">
                        <img class="card-img-top" src="" alt="Card image caption">
                        <div class="card-body">
                            <p class="card-text">Caption or comment</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="insertHtmlFooter"></div>
    <script>
        pullHTML('footer', 'insertHtmlFooter', () => {});
    </script>

    <script defer src="/js/recipe.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.initRecipe();
        })
    </script>
</body>
</html>
