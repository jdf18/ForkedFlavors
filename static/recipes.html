<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forked Flavours: Recipes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/recipes.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
</head>
<body>
    <script src="/js/pullhtml.js"></script> <!-- Contains pullHTML function to load html components -->
    <script src="/js/api.js"></script> <!-- Contains all functions to call the API -->

    <div id="insertHtmlNavbar"></div>
    <script>
        pullHTML('navbar', 'insertHtmlNavbar', () => {
            window.initNavbar();
            window.initLogin();
        });
    </script>
    <script defer src="/js/navbar.js"></script> <!-- Navbar related js -->
    <script defer src="/js/login.js"></script> <!-- js for login/logout button -->

    <header>
        <div class="header-overlay"></div>
        <div class="container h-100 text-white header-content">
            <div class="d-flex justify-content-center">
                <h1 class="header-title">Browse Recipes</h1>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="search-container">
                        <input type="text" id="search-bar" class="search-input form-control" placeholder="Search for recipe..." />
                        <i class="fas fa-search search-icon"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container my-4">
            <div id="recipes-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
                <!-- Recipe cards added here -->
            </div>
        </div>
    </main>

    <script defer src="/js/recipes.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.initRecipes();
        })
    </script>
</body>
</html>
